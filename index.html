<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doğum Haritası">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon-180.png">
<title>Doğum Haritası Asistanı</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0f1226; --bg2:#151935; --bg3:#1c2142; --ink:#f3eee3; --muted:#a9a4bb; --gold:#d8b46a; --line:rgba(216,180,106,.28);
    --soft:rgba(216,180,106,.12); --red:#e3a397; --blue:#9cc8e4; --green:#9fd3b0; color-scheme:dark }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom)}
  .serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}
  a{color:var(--gold)}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
    background:rgba(21,25,53,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header .logo{font-size:23px;cursor:pointer;white-space:nowrap}
  header .logo em{color:var(--gold);font-style:italic}
  .sp{flex:1}
  nav{display:flex;gap:6px}
  .btn{font:inherit;font-size:14px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer;
    white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.p{background:var(--gold);color:#1a1630;border-color:var(--gold);font-weight:600}
  .btn.p:hover{filter:brightness(1.08);color:#1a1630}
  .btn.k{padding:5px 10px;font-size:13px}
  .btn.tehlike{color:var(--red);border-color:rgba(227,163,151,.4)}
  main{max-width:1100px;margin:0 auto;padding:22px 16px 60px;overflow-wrap:anywhere}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:38px;line-height:1.08}
  h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:28px;margin-bottom:10px}
  h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:22px;color:var(--gold)}
  .muted{color:var(--muted)}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
  .grid > *{min-width:0}
  .ev-yorum{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;line-height:1.65;color:var(--ink);opacity:.92} .ev-yorum p+p{margin-top:9px} .ev-kopya{margin-top:12px;font-size:13px;padding:7px 12px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (max-width:1000px){ nav .yazi{display:none} }
  @media (max-width:760px){ .g2,.g3{grid-template-columns:minmax(0,1fr)} h1{font-size:30px} main{padding-top:16px} header .logo{font-size:20px} nav{gap:4px} nav .btn{padding:8px 10px}
    td,th{padding-left:5px;padding-right:5px} .ust3 .s{font-size:24px} }
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;letter-spacing:.04em}
  input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  textarea{resize:vertical;line-height:1.6;min-height:110px}
  input[type=checkbox]{width:auto;accent-color:var(--gold)}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:0}
  .form{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  .form .tam{grid-column:1/-1}
  @media (max-width:760px){ .form{grid-template-columns:1fr} }
  .liste{display:grid;gap:10px;margin-top:16px}
  .kisi{display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s}
  .kisi:hover{border-color:var(--gold)}
  .kisi .ad{font-size:17px;font-weight:500}
  .kisi .alt{font-size:13px;color:var(--muted);margin-top:3px}
  .rozet{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--gold);white-space:nowrap}
  .sekmeler{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 18px;scrollbar-width:none}
  .sekmeler::-webkit-scrollbar{display:none}
  .sekmeler button{font:inherit;font-size:14px;background:none;border:none;color:var(--muted);padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .sekmeler button.on{color:var(--gold);border-bottom-color:var(--gold)}
  .ust3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .ust3 .card{text-align:center;padding:14px 8px}
  .ust3 .s{font-size:28px;color:var(--gold);font-family:"Apple Symbols","Segoe UI Symbol",serif}
  .ust3 .b{font-size:16px;margin-top:4px}
  .ust3 .e{font-size:12px;color:var(--muted)}
  .carkk{display:flex;justify-content:center}
  .carkk svg{width:100%;max-width:520px;height:auto}
  table{width:100%;border-collapse:collapse}
  th{white-space:nowrap;overflow-wrap:normal;text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500;padding:0 8px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--soft);font-size:14px;color:var(--muted);vertical-align:top}
  td.k{color:var(--ink);white-space:nowrap}
  .bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin:6px 0 12px}
  .bar i{display:block;height:100%;background:var(--gold)}
  .row{display:flex;justify-content:space-between;font-size:14px}
  .alan{margin-bottom:18px}
  .alan .bas{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .alan .bas b{font-weight:500}
  .durum{font-size:12px;color:var(--muted)}
  .uyari{background:rgba(227,163,151,.08);border:1px solid rgba(227,163,151,.35);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
  .bilgi{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
  .oneri{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--bg3);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:300px;overflow:auto}
  .oneri div{padding:10px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--soft)}
  .oneri div:hover,.oneri div.on{background:var(--soft);color:var(--gold)}
  .gecis{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .gecis button{font:inherit;font-size:13px;background:none;border:none;color:var(--muted);padding:7px 12px;cursor:pointer}
  .gecis button.on{background:var(--gold);color:#1a1630;font-weight:600}
  .ortu{position:fixed;inset:0;background:rgba(5,6,18,.72);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
  .ortu .card{width:100%;max-width:720px}
  #tost{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold);color:#1a1630;font-weight:600;
    padding:10px 18px;border-radius:24px;z-index:80;display:none;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  #kilit{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
  #kilit input{max-width:220px;text-align:center;font-size:22px;letter-spacing:.4em}
  .gz .hl{transition:fill-opacity .15s}
  .bos{text-align:center;padding:50px 20px;color:var(--muted)}
</style>
</head>
<body>
<div id="kilit"><div class="serif" style="font-size:34px">Doğum Haritası</div><div class="muted">Devam etmek için PIN gir</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12"><button class="btn p" onclick="kilitAc()">Aç</button><div id="pinhata" class="durum"></div></div>
<header>
  <div class="logo serif" onclick="git('#bugun')">Doğum <em>Haritası</em></div>
  <span id="sn-durum" style="display:none;font-size:16px;cursor:pointer" onclick="senkronSimdi()"></span>
  <span class="sp"></span>
  <nav>
    <button class="btn" onclick="git('#bugun')" aria-label="Bugün">🏠 <span class="yazi">Bugün</span></button>
    <button class="btn" onclick="git('#liste')" aria-label="Danışanlar">👥 <span class="yazi">Danışanlar</span></button>
    <button class="btn" onclick="git('#sinastri')" aria-label="Sinastri">💞 <span class="yazi">Sinastri</span></button>
    <button class="btn p" onclick="git('#yeni')">＋ <span class="yazi">Yeni Okuma</span></button>
    <button class="btn" onclick="git('#ayarlar')" aria-label="Ayarlar">⚙️</button>
  </nav>
</header>
<main id="ana"></main>
<div id="tost"></div>
<script src="lib/astronomy.min.js"></script>
<script src="lib/nunjucks.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="js/astro.js"></script>
<script src="js/yorum.js"></script>
<script src="js/evler.js"></script>
<script src="js/cark.js"></script>
<script src="js/rapor.js"></script>
<script src="js/kripto.js"></script>
<script src="js/senkron.js"></script>
<script src="js/sinastri.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
<script src="js/ozellikler.js"></script>
</body>
</html>
